<ng-container *ngIf="order; else orderMissing">
  <div class="card order-card">
    <div class="card-body">
      <h4>Order id {{ (order | async)?.id }}</h4>

      <div class="row fw-semibold border-bottom pb-2 mb-2">
        <div class="col-6">Product</div>
        <div class="col-2">Count</div>
        <div class="col-4">Price</div>
      </div>

      <div class="row py-1" *ngFor="let product of (order | async)?.shoppingCart?.products">
        <div class="col-6">{{ product.product!.name }}</div>
        <div class="col-2">{{ product.count }}</div>
        <div class="col-4">{{ product.product!.price!.value | currency: currency }}</div>
      </div>

      <div class="row g-2 align-items-end mt-3">
        <div class="col-md-4">
          <label class="form-label" for="orderState">State</label>
          <select id="orderState" class="form-select" [(ngModel)]="selectedIdx">
            <option [value]="0">New</option>
            <option [value]="1">InProgress</option>
            <option [value]="2">Ended</option>
            <option [value]="3">Cancelled</option>
          </select>
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary" type="button" (click)="onChangeState()">Change state</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #orderMissing>
  <div class="alert alert-warning">No such order.</div>
</ng-template>
