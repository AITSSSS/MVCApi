<section class="form-page">
  <div class="card">
    <div class="card-body">
      <h3 class="card-title mb-3">Add product</h3>

      <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="productName">Product name</label>
          <input id="productName" class="form-control" type="text" formControlName="name" />
          <div class="invalid-feedback d-block" *ngIf="submitted && f['name'].errors?.['required']">Name is required</div>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="productDescription">Description</label>
          <input id="productDescription" class="form-control" type="text" formControlName="description" />
          <div class="invalid-feedback d-block" *ngIf="submitted && f['description'].errors?.['required']">Description is required</div>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="productImage">Image path or URL</label>
          <input id="productImage" class="form-control" type="text" formControlName="image" />
          <div class="invalid-feedback d-block" *ngIf="submitted && f['image'].errors?.['required']">Image is required</div>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="productPrice">Price</label>
          <input id="productPrice" class="form-control" type="number" formControlName="price" />
          <div class="invalid-feedback d-block" *ngIf="submitted && f['price'].errors?.['required']">Price is required</div>
          <div class="invalid-feedback d-block" *ngIf="submitted && f['price'].errors?.['min']">Price must be greater than 0</div>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="productCategory">Category</label>
          <select id="productCategory" class="form-select" formControlName="categories">
            <option [value]="category.id" *ngFor="let category of categories | async">{{ category.name }}</option>
          </select>
          <div class="invalid-feedback d-block" *ngIf="submitted && f['categories'].errors?.['required']">Category is required</div>
        </div>

        <div class="col-12 d-flex justify-content-end align-items-center gap-3">
          <div class="text-muted d-flex align-items-center gap-2" *ngIf="isSaving">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Saving...</span>
          </div>
          <div class="text-success" *ngIf="saveStatus === 'saved'">Saved</div>
          <div class="text-danger" *ngIf="saveStatus === 'error'">Save failed</div>
          <button class="btn btn-primary" type="submit" [disabled]="isSaving">Submit</button>
        </div>
      </form>
    </div>
  </div>
</section>
