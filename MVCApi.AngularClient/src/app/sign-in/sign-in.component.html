<section class="auth-page">
  <div class="card auth-card">
    <div class="card-body">
      <h2 class="card-title mb-1">Sign in</h2>
      <p class="text-muted mb-3">Access your account to continue shopping</p>

      <p *ngIf="isLoggedIn" class="status-success">Successfully logged in</p>
      <p *ngIf="message && !isLoggedIn" class="status-error">{{ message }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div>
          <label class="form-label" for="loginEmail">Email</label>
          <input id="loginEmail" class="form-control" type="email" formControlName="email" autocomplete="email" />
        </div>

        <div>
          <label class="form-label" for="loginPassword">Password</label>
          <input id="loginPassword" class="form-control" type="password" formControlName="password" autocomplete="current-password" />
        </div>

        <div class="form-check">
          <input id="rememberMe" class="form-check-input" type="checkbox" formControlName="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</section>
