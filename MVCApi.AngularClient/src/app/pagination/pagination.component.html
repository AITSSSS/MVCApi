<div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
  <div class="btn-group" role="group">
    <button class="btn btn-outline-secondary" type="button" *ngIf="hasPreviousPage" (click)="onPreviousPage()">
      &laquo;
    </button>

    <button
      class="btn"
      [ngClass]="item === pageIndex ? 'btn-primary' : 'btn-outline-secondary'"
      type="button"
      *ngFor="let item of rangeWithDots"
      [disabled]="item === '...'"
      (click)="onPageChange(item)"
    >
      {{ item }}
    </button>

    <button class="btn btn-outline-secondary" type="button" *ngIf="hasNextPage" (click)="onNextPage()">
      &raquo;
    </button>
  </div>

  <div class="d-flex align-items-center gap-2">
    <label class="form-label mb-0" for="pageSizeSelect">Page size</label>
    <select
      id="pageSizeSelect"
      class="form-select form-select-sm"
      style="width: 120px"
      [(ngModel)]="pageSize"
      (ngModelChange)="onPageSizeChanged({ value: $event })"
    >
      <option *ngFor="let size of allowedPageSizes" [value]="size">{{ size }}</option>
    </select>
  </div>
</div>
