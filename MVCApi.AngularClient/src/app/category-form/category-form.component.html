<section class="form-page">
  <div class="card">
    <div class="card-body">
      <h3 class="card-title mb-3">Add category</h3>

      <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
        <div class="col-12">
          <label class="form-label" for="categoryName">Category name</label>
          <input id="categoryName" class="form-control" type="text" formControlName="name" />
          <div class="invalid-feedback d-block" *ngIf="submitted && f['name'].errors?.['required']">Name is required</div>
        </div>

        <div class="col-12">
          <div class="form-check">
            <input id="categoryIsChild" class="form-check-input" type="checkbox" formControlName="isChild" />
            <label class="form-check-label" for="categoryIsChild">Is subcategory?</label>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label" for="categoryParent">Parent category</label>
          <select id="categoryParent" class="form-select" [disabled]="!form.get('isChild')?.value" formControlName="parent">
            <option value="">Select parent category</option>
            <option [value]="category.id" *ngFor="let category of categories | async">{{ category.name }}</option>
          </select>
        </div>

        <div class="col-12 d-flex justify-content-end align-items-center gap-3">
          <div class="text-muted d-flex align-items-center gap-2" *ngIf="isSaving">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Saving...</span>
          </div>
          <div class="text-success" *ngIf="saveStatus === 'saved'">Saved</div>
          <div class="text-danger" *ngIf="saveStatus === 'error'">Save failed</div>
          <button class="btn btn-primary" type="submit" [disabled]="isSaving">Submit</button>
        </div>
      </form>
    </div>
  </div>
</section>
