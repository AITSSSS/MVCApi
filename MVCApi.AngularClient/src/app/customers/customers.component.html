<section class="page-shell">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Customers</h2>
    <a class="btn btn-primary" [routerLink]="['/', 'customers', 'add']">Add customer</a>
  </div>

  <div class="d-grid gap-3">
    <div class="card" *ngFor="let customer of $customers | async">
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4"><strong>First name:</strong> {{ customer.firstName }}</div>
          <div class="col-md-4"><strong>Last name:</strong> {{ customer.lastName }}</div>
          <div class="col-md-4"><strong>Date of birth:</strong> {{ customer.dateOfBirth | date }}</div>
        </div>
      </div>
      <div class="card-footer bg-transparent text-end">
        <a class="btn btn-outline-primary btn-sm" [routerLink]="['/', 'customers', 'edit', customer.id]">Edit</a>
      </div>
    </div>
  </div>
</section>
