<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">Export price list</h5>
    <p class="text-muted">Create a PDF snapshot of currently visible products.</p>

    <div id="pdfTable" #pdfTable *ngIf="products" class="table-responsive">
      <table class="table table-sm align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of (products | async)?.items">
            <td>{{ product.name }}</td>
            <td>{{ product.price?.value | currency: currency }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="card-footer bg-transparent text-end">
    <button class="btn btn-outline-primary btn-sm" type="button" (click)="downloadAsPDF()">Export to PDF</button>
  </div>
</div>
