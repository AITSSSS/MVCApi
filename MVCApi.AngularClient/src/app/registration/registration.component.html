<section class="auth-page">
  <div class="card auth-card">
    <div class="card-body">
      <h2 class="card-title mb-1">Create account</h2>
      <p class="text-muted mb-3">Register to use checkout and order tracking</p>

      <p *ngIf="message && successfulRegistration" class="status-success">{{ message }}</p>
      <p *ngIf="message && !successfulRegistration" class="status-error">{{ message }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div>
          <label class="form-label" for="registerUserName">Username</label>
          <input id="registerUserName" class="form-control" type="text" formControlName="userName" autocomplete="username" />
        </div>

        <div>
          <label class="form-label" for="registerEmail">Email</label>
          <input id="registerEmail" class="form-control" type="email" formControlName="email" autocomplete="email" />
        </div>

        <div>
          <label class="form-label" for="registerPassword">Password</label>
          <input id="registerPassword" class="form-control" type="password" formControlName="password" autocomplete="new-password" />
        </div>

        <button class="btn btn-primary" type="submit">Register</button>
      </form>
    </div>
  </div>
</section>
