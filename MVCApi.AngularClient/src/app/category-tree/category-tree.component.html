<div *ngIf="category" class="list-group">
  <a
    class="list-group-item list-group-item-action fw-semibold"
    [routerLink]="['/products']"
    [queryParams]="{ categoryId: category.id }"
  >
    {{ category.name }}
  </a>

  <div class="ms-3 mt-1" *ngFor="let child of category.children">
    <app-category-tree [category]="child"></app-category-tree>
  </div>
</div>
