<section class="products-page row g-3">
  <aside class="col-lg-3">
    <div class="card">
      <div class="card-header">Categories</div>
      <div class="card-body d-grid gap-2">
        <app-category-tree *ngFor="let category of categories | async" [category]="category"></app-category-tree>
      </div>
    </div>
  </aside>

  <div class="col-lg-9" *ngIf="products">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="m-0">Products</h2>
      <a class="btn btn-primary" [routerLink]="['/products/add']">Add product</a>
    </div>

    <div class="d-grid gap-3 mb-3">
      <div class="card" *ngFor="let product of (products | async)?.items">
        <div class="card-body">
          <app-product [product]="product"></app-product>
        </div>
        <div class="card-footer bg-transparent text-end d-flex justify-content-end gap-2">
          <button class="btn btn-primary btn-sm" type="button" (click)="addToCart(product.id)">Add to cart</button>
          <button class="btn btn-outline-primary btn-sm" type="button" [routerLink]="['/', 'products', 'edit', product.id]">Edit</button>
        </div>
      </div>
    </div>

    <app-products-pdf [products]="products"></app-products-pdf>

    <app-pagination
      [(pageIndex)]="pageIndex"
      (pageIndexChange)="pageIndexChange()"
      [(totalPages)]="totalPages"
      (totalPagesChange)="totalPagesChange()"
      [hasNextPage]="hasNextPage"
      [hasPreviousPage]="hasPreviousPage"
      [(pageSize)]="pageSize"
      (pageSizeChange)="pageSizeChange()"
    ></app-pagination>
  </div>
</section>
