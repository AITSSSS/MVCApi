<nav class="navbar navbar-expand-lg navbar-dark bg-primary app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Eshop</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" routerLink="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/customers">Customers</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/categories">Categories</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/popularity">Popularity</a></li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch text-light m-0">
          <input
            class="form-check-input"
            type="checkbox"
            [checked]="(isDarkTheme$ | async) ?? false"
            (change)="toggleTheme()"
            id="themeSwitch"
          />
          <label class="form-check-label" for="themeSwitch">Dark mode</label>
        </div>

        <a class="nav-link text-light" *ngIf="!(isAuthenticated$ | async)" routerLink="/register">Register</a>
        <a class="nav-link text-light" *ngIf="!(isAuthenticated$ | async)" routerLink="/login">Sign in</a>
        <a class="nav-link text-light" *ngIf="isAuthenticated$ | async" routerLink="/signout">Sign out</a>
        <a class="nav-link text-light" routerLink="/cart"><i class="bi bi-cart"></i></a>
      </div>
    </div>
  </div>
</nav>

<div class="global-loading" *ngIf="isLoading$ | async">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<main class="container app-content">
  <router-outlet></router-outlet>
</main>
