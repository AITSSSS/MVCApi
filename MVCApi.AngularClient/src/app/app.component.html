<nav class="navbar navbar-expand-lg navbar-dark bg-primary app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" routerLink="/" routerLinkActive="active-brand" [routerLinkActiveOptions]="{ exact: true }">
      <img src="assets/logo.svg" alt="Eshop logo" class="brand-logo" />
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/customers" routerLinkActive="active">Customers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/categories" routerLinkActive="active">Categories</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/popularity" routerLinkActive="active">Popularity</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <button
          class="btn btn-link text-light nav-icon-btn"
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="((isDarkTheme$ | async) ?? false) ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="((isDarkTheme$ | async) ?? false) ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <i
            class="bi"
            [ngClass]="((isDarkTheme$ | async) ?? false) ? 'bi-moon-stars-fill' : 'bi-sun-fill'"
          ></i>
        </button>

        <a class="nav-link text-light nav-icon-link" routerLink="/cart" routerLinkActive="active" title="Cart" aria-label="Cart">
          <i class="bi bi-cart"></i>
        </a>

        <a
          class="nav-link text-light nav-icon-link"
          *ngIf="!(isAuthenticated$ | async)"
          routerLink="/register"
          routerLinkActive="active"
          title="Register"
          aria-label="Register"
        >
          <i class="bi bi-person-plus-fill"></i>
        </a>
        <a
          class="nav-link text-light nav-icon-link"
          *ngIf="!(isAuthenticated$ | async)"
          routerLink="/login"
          routerLinkActive="active"
          title="Sign in"
          aria-label="Sign in"
        >
          <i class="bi bi-box-arrow-in-right"></i>
        </a>
        <a
          class="nav-link text-light nav-icon-link"
          *ngIf="isAuthenticated$ | async"
          routerLink="/signout"
          routerLinkActive="active"
          title="Sign out"
          aria-label="Sign out"
        >
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </div>
    </div>
  </div>
</nav>

<div class="global-loading" *ngIf="isLoading$ | async">
  <div class="spinner-border text-light" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<main class="container app-content">
  <router-outlet></router-outlet>
</main>
