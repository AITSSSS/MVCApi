<section class="details-page" *ngIf="product">
  <div class="card">
    <div class="card-body">
      <div class="text-end mb-3">
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="copyMessage()">Copy HTML code</button>
      </div>

      <div class="row g-3 align-items-start">
        <div class="col-md-3">
          <img
            *ngIf="!product.image?.startsWith('http')"
            [src]="'/assets' + product.image"
            alt="{{ product.name + '_image' }}"
            class="img-fluid rounded"
          />
          <img
            *ngIf="product.image?.startsWith('http')"
            [src]="product.image"
            alt="{{ product.name + '_image' }}"
            class="img-fluid rounded"
          />
        </div>

        <div class="col-md-7">
          <h2>{{ product.name }}</h2>
          <div [innerHTML]="product.description"></div>
        </div>

        <div class="col-md-2 fw-semibold text-nowrap">
          <span *ngIf="product.price && product.price.currency">
            {{ product.price.value | currency: currency }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
